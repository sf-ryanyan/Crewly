<style>
/* =========================================================
   CREWLY — DESIGN TOKENS (MASTER)
   Mode: login = task (3), app = system (4)
   Style: S1 Data Dashboard + M1 editorial touches (serif titles & big numbers)
   Colour: near-complementary — ink teal (h≈195) main / copper (h≈45) accent
           muted character, 60 warm ground / 30 teal / 10 copper, OKLCH
   Dials: variance 3 · motion 2 · density 7
   ========================================================= */
:root{
  --ground:oklch(0.972 0.008 165);
  --surface:oklch(0.995 0.003 165);
  --surface-2:oklch(0.955 0.010 170);
  --surface-3:oklch(0.925 0.013 175);
  --line:oklch(0.900 0.012 175);
  --line-2:oklch(0.835 0.015 180);
  --ink:oklch(0.23 0.025 200);
  --ink-2:oklch(0.41 0.022 200);
  --ink-3:oklch(0.52 0.018 200);
  --brand:oklch(0.33 0.055 195);
  --brand-2:oklch(0.40 0.060 195);
  --brand-3:oklch(0.27 0.045 198);
  --brand-ink:oklch(0.95 0.015 190);
  --brand-ink-2:oklch(0.80 0.028 190);
  --brand-soft:oklch(0.935 0.026 192);
  --accent:oklch(0.64 0.145 45);
  --accent-strong:oklch(0.52 0.135 42);
  --accent-soft:oklch(0.955 0.032 55);
  --ok:oklch(0.48 0.11 152);   --ok-soft:oklch(0.95 0.04 152);
  --warn:oklch(0.50 0.10 75);  --warn-soft:oklch(0.955 0.05 88);
  --err:oklch(0.51 0.17 27);   --err-soft:oklch(0.955 0.03 25);
  --info:oklch(0.47 0.08 235); --info-soft:oklch(0.952 0.025 235);
  --c1:oklch(0.33 0.055 195); --c2:oklch(0.58 0.075 188); --c3:oklch(0.82 0.055 180);
  --r:12px; --r-sm:8px; --r-xs:6px;
  --shadow:0 1px 2px oklch(0.3 0.03 195 / .05),0 10px 30px oklch(0.3 0.03 195 / .07);
  --shadow-lg:0 2px 6px oklch(0.3 0.03 195 / .08),0 30px 70px oklch(0.25 0.04 195 / .18);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --f-display:'Instrument Serif','Noto Serif SC','Songti SC',Georgia,serif;
  --f-ui:'Geist','Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.55;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:clip}
:lang(zh) body{line-height:1.8}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:200;text-decoration:none}
.skip:focus{top:12px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px} svg.i.l{width:22px;height:22px}

/* ---------- buttons, chips, fields ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
@media(hover:hover){.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}}
.btn-primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
@media(hover:hover){.btn-primary:hover{background:oklch(from var(--accent-strong) calc(l - .05) c h);border-color:oklch(from var(--accent-strong) calc(l - .05) c h)}}
.btn-dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
@media(hover:hover){.btn-dark:hover{background:var(--brand-3);border-color:var(--brand-3)}}
.btn-quiet{border-color:transparent;background:transparent}
@media(hover:hover){.btn-quiet:hover{background:var(--surface-2);border-color:transparent}}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn-icon{width:40px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip svg.i{width:13px;height:13px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .help{font-size:13px;color:var(--ink-3)}
.field .err-msg{font-size:13px;color:var(--err);display:flex;gap:6px;align-items:center}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);transition:border-color .2s,box-shadow .2s}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px oklch(from var(--brand-2) l c h / .15)}
.input[aria-invalid=true]{border-color:var(--err)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;min-height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px oklch(0.3 0.03 195 / .12)}

/* ---------- LOGIN ---------- */
.login{position:relative;isolation:isolate;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,452px);gap:clamp(32px,5vw,88px);align-items:center;padding:clamp(24px,3.5vw,44px) clamp(20px,5vw,72px);color:var(--brand-ink);background:radial-gradient(120% 90% at 0% 0%,oklch(0.40 0.06 192),transparent 60%),var(--brand-3)}
.login-bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.login-bg img{width:100%;height:100%;object-fit:cover;object-position:32% 50%;animation:kb 22s var(--ease) both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.login-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,oklch(0.17 0.035 200 / .84) 0%,oklch(0.17 0.035 200 / .58) 40%,oklch(0.17 0.035 200 / .22) 72%,oklch(0.17 0.035 200 / .38) 100%),linear-gradient(0deg,oklch(0.15 0.035 200 / .78) 0%,transparent 55%)}
.login-copy{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:calc(100dvh - 2 * clamp(24px,3.5vw,44px))}
.login-copy .logo{color:var(--brand-ink);font-size:20px}
.login-tag{display:inline-flex;align-items:center;gap:12px;font-size:12.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink-2);margin-bottom:20px}
.login-tag::before{content:"";width:28px;height:1.5px;background:var(--accent)}
:lang(zh) .login-tag{text-transform:none;letter-spacing:.2em}
.login-copy h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,6.6vw,108px);line-height:.96;letter-spacing:-.025em;margin:0 0 24px;max-width:11ch;text-wrap:balance}
:lang(zh) .login-copy h1{font-weight:600;line-height:1.18;letter-spacing:.04em;font-size:clamp(40px,4.8vw,72px);max-width:none}
.login-copy .lede{font-size:18px;line-height:1.6;max-width:44ch;color:oklch(0.90 0.02 190);margin:0}
:lang(zh) .login-copy .lede{line-height:1.9}
.login-facts{list-style:none;display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 0;padding:0;max-width:640px}
.login-facts li{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;padding:8px 14px;border-radius:999px;background:oklch(1 0 0 / .08);border:1px solid oklch(1 0 0 / .16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.login-card{color:var(--ink);background:var(--surface);border-radius:24px;padding:30px 30px 20px;box-shadow:0 40px 90px oklch(0.1 0.03 200 / .5),0 2px 8px oklch(0.1 0.03 200 / .2);animation:pop .55s var(--ease) both}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.login-card h2{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.08;margin:0;letter-spacing:-.01em}
:lang(zh) .login-card h2{font-weight:600;font-size:28px}
.login-card .sub{color:var(--ink-3);margin:4px 0 20px;font-size:14px}
.stack{display:grid;gap:14px}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:22px 0 16px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.lc-label{font-size:12px;font-weight:500;color:var(--ink-3);margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em}
:lang(zh) .lc-label{text-transform:none;letter-spacing:.1em;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background .2s,border-color .2s,color .2s,transform .15s var(--ease)}
.pill:active{transform:scale(.97)}
@media(hover:hover){.pill:hover{border-color:var(--brand-2);color:var(--ink)}}
.pill[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pill-note{font-size:12.5px;color:var(--ink-3);margin:8px 0 18px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:11px 12px;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.role-opt:active{transform:scale(.98)}
.role-opt .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--brand);flex:none;border:1px solid var(--line);transition:background .2s,color .2s}
.role-opt b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.role-opt small{display:block;color:var(--ink-3);font-size:12px;line-height:1.35}
@media(hover:hover){.role-opt:hover{border-color:var(--brand-2);background:var(--surface)}.role-opt:hover .ico{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}}
.login-foot{margin:18px 0 0;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;justify-content:center}
.lang-btn{display:inline-flex;align-items:center;gap:6px}
@media (max-width:1023px){
 .login{grid-template-columns:minmax(0,1fr);padding:0;gap:0;align-items:start}
 .login-bg{bottom:auto;height:min(80vh,620px)}
 .login-copy{min-height:auto;padding:24px 22px 80px;gap:72px}
 .login-copy h1{font-size:clamp(46px,11vw,72px)}
 .login-copy .lede{font-size:16px}
 .login-card{margin:-48px 14px 28px;padding:24px 20px 18px;max-width:560px;justify-self:center;width:calc(100% - 28px)}
}
@media (max-width:360px){.role-grid{grid-template-columns:1fr}}

.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.01em}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.logo-mark svg{width:18px;height:18px}
/* ---------- DEMO STRIP ---------- */
.demo{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;min-height:44px;padding:6px 16px;background:var(--brand-3);color:var(--brand-ink-2);font-size:13px}
.demo-label{display:flex;align-items:center;gap:8px;color:var(--brand-ink);font-weight:500;white-space:nowrap}
.demo-label i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px oklch(from var(--accent) l c h / .2)}
.demo-ctrls{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap}
.demo .seg{background:oklch(1 0 0 / .06);border-color:oklch(1 0 0 / .08)}
.demo .seg button{color:var(--brand-ink-2);min-height:28px;padding:0 10px}
.demo .seg button[aria-pressed=true]{background:var(--brand-ink);color:var(--brand-3)}
.demo select{min-height:30px;border-radius:7px;border:1px solid oklch(1 0 0 / .14);background:oklch(1 0 0 / .06);color:var(--brand-ink);padding:0 8px;font-size:13px}
.demo select option{color:var(--ink)}
.demo .dbtn{min-height:30px;border-radius:7px;border:1px solid oklch(1 0 0 / .14);background:transparent;color:var(--brand-ink);padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
@media(hover:hover){.demo .dbtn:hover{background:oklch(1 0 0 / .08)}}
.demo .spacer{flex:1}
.demo-toggle{display:none}

/* ---------- APP SHELL ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100dvh - 44px)}
.side{position:sticky;top:44px;height:calc(100dvh - 44px);background:var(--brand);color:var(--brand-ink-2);display:flex;flex-direction:column;padding:18px 12px}
.side .logo{color:var(--brand-ink);padding:4px 10px 16px}
.org{margin:0 4px 16px;padding:10px 12px;border-radius:10px;background:oklch(1 0 0 / .06);border:1px solid oklch(1 0 0 / .07)}
.org small{display:block;font-size:12px;color:var(--brand-ink-2)}
.org b{display:block;font-weight:500;color:var(--brand-ink);font-size:14px}
.nav{display:grid;gap:2px}
.nav-sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:oklch(0.72 0.03 190);padding:14px 12px 6px}
:lang(zh) .nav-sec{text-transform:none;letter-spacing:.1em}
.nav a{position:relative;display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:9px;text-decoration:none;color:var(--brand-ink-2);font-size:14px;transition:background .2s,color .2s}
@media(hover:hover){.nav a:hover{background:oklch(1 0 0 / .06);color:var(--brand-ink)}}
.nav a[aria-current=page]{background:var(--brand-2);color:var(--brand-ink)}
.nav a[aria-current=page]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a .soon{margin-left:auto;font-size:11px;color:oklch(0.72 0.03 190)}
.nav a .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;display:grid;place-items:center;font-weight:600}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid oklch(1 0 0 / .08)}
.side-foot b{display:block;color:var(--brand-ink);font-weight:500;font-size:14px;line-height:1.3}
.side-foot small{font-size:12px}
.side-foot button{margin-left:auto;color:var(--brand-ink-2);border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
@media(hover:hover){.side-foot button:hover{background:oklch(1 0 0 / .08);color:var(--brand-ink)}}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;background:var(--surface-3);color:var(--brand)}
.side .av{background:var(--accent);color:#fff}
.av.sm{width:28px;height:28px;font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:44px;z-index:40;display:flex;align-items:center;gap:12px;height:64px;padding:0 28px;background:oklch(from var(--ground) l c h / .86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .crumb{font-size:13.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px;min-width:0}
.top .crumb b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.top select.input{min-height:38px;width:auto;padding:0 32px 0 12px;font-size:14px}
.top .date{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.bell{position:relative}
.bell .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--err);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--ground)}
.menu-btn{display:none}
#view{padding:28px;max-width:1360px;width:100%;outline:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:13px;color:var(--ink-3);margin:0 0 4px}
h1.title{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.08;letter-spacing:-.015em;margin:0}
:lang(zh) h1.title{font-weight:600;font-size:30px;letter-spacing:.02em;line-height:1.3}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px}
.card-h h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
.card-h .meta{font-size:13px;color:var(--ink-3)}
.card-b{padding:0 18px 18px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.g-11{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.kpi{padding:16px 18px 18px}
.kpi .lbl{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.kpi .lbl svg{color:var(--ink-3)}
.kpi .val{font-family:var(--f-display);font-size:44px;line-height:1;margin:12px 0 8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .val small{font-family:var(--f-ui);font-size:15px;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.kpi .val .chip{font-family:var(--f-ui);font-size:13px;letter-spacing:0}
.kpi .sub{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi.alert{border-color:oklch(from var(--accent) 0.85 0.06 h);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}

/* tables */
.tbl-wrap{overflow-x:auto;position:relative}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;font-size:12.5px;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line-2);background:var(--surface-2)}
@media(hover:hover){.tbl tbody tr:hover td{background:oklch(from var(--surface-2) l c h / .6)}}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:500;line-height:1.3}
.who small{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.3}
.muted{color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* alerts list */
.alist{list-style:none;margin:0;padding:0}
.alist li a,.alist li .row{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;text-decoration:none;border-top:1px solid var(--line);transition:background .2s}
@media(hover:hover){.alist li a:hover{background:var(--surface-2)}}
.alist .sev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.sev.err{background:var(--err-soft);color:var(--err)} .sev.warn{background:var(--warn-soft);color:var(--warn)} .sev.info{background:var(--info-soft);color:var(--info)} .sev.ok{background:var(--ok-soft);color:var(--ok)}
.alist b{display:block;font-weight:500;font-size:14px;line-height:1.35}
.alist small{display:block;font-size:12.5px;color:var(--ink-3)}
.alist .t{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3)}
.empty svg{width:28px;height:28px;color:var(--ok);margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-weight:500}

/* store tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:transparent;min-height:30px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.tabs button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand);border-color:oklch(from var(--brand) 0.85 0.04 h)}

/* gantt */
.gantt{--gw:168px;padding:4px 18px 18px}
.g-axis,.g-row{display:grid;grid-template-columns:var(--gw) minmax(0,1fr);align-items:center}
.g-axis{font-size:11.5px;color:var(--ink-3);height:26px}
.g-ticks{position:relative;height:100%}
.g-ticks span{position:absolute;top:6px;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.g-row{height:42px;border-top:1px solid var(--line)}
.g-row .who b{font-size:13.5px} .g-row .who small{font-size:12px}
.g-track{position:relative;height:100%;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--hw) - 1px),var(--line) calc(var(--hw) - 1px),var(--line) var(--hw))}
.g-sched{position:absolute;top:10px;bottom:10px;border:1.5px dashed var(--line-2);border-radius:6px;background:oklch(from var(--surface-2) l c h / .7)}
.g-act{position:absolute;top:14px;bottom:14px;border-radius:5px;background:var(--brand)}
.g-act.late{background:linear-gradient(90deg,var(--warn) 0 var(--lw),var(--brand) var(--lw))}
.g-act.live::after{content:"";position:absolute;right:-1px;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--accent)}
.g-sched.absent{border-color:var(--err);background:var(--err-soft)}
.g-now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);z-index:2}
.g-now span{position:absolute;top:-1px;left:4px;font-size:11px;color:var(--accent-strong);font-weight:600;white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:3px}
.g-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);padding:0 18px 16px}
.g-legend span{display:flex;align-items:center;gap:6px}
.g-legend i{width:18px;height:8px;border-radius:3px;display:inline-block}

/* charts */
.chart{padding:4px 18px 16px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:0 18px 16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--brand)}
.hbar{display:grid;gap:14px;padding:6px 18px 20px}
.hbar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13.5px}
.hbar-track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;background:var(--brand);transform-origin:left;animation:grow .8s var(--ease) both}
.hbar-fill.mid{background:var(--warn)}
@keyframes grow{from{transform:scaleX(0)}}

/* placeholders */
.soon-card{padding:48px 28px;text-align:center;max-width:620px;margin:40px auto}
.soon-card .big{width:56px;height:56px;border-radius:14px;margin:0 auto 18px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.soon-card h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0 0 8px}
:lang(zh) .soon-card h2{font-weight:600;font-size:24px}
.soon-card p{color:var(--ink-2);margin:0 auto 18px;max-width:48ch}
.soon-card ul{list-style:none;padding:0;margin:0 auto 20px;display:grid;gap:8px;text-align:left;max-width:380px}
.soon-card li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:14px}
.soon-card li svg{color:var(--ok);margin-top:2px}

/* day nav */
.daynav{display:flex;align-items:center;gap:6px}
.daynav .lbl{min-width:150px;text-align:center;font-weight:500}
.summary{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}

/* audit */
.audit{list-style:none;margin:0;padding:0}
.audit li{display:flex;gap:12px;padding:12px 18px;border-top:1px solid var(--line);font-size:14px}
.audit .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--info-soft);color:var(--info);flex:none}
.audit b{font-weight:500}
.audit .chg{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:13px;background:var(--surface-2);padding:2px 8px;border-radius:6px;margin-top:4px}
.audit s{color:var(--ink-3)}
.audit .note{font-size:13px;color:var(--ink-3);margin-top:3px}

/* requests */
.req{display:flex;gap:12px;padding:14px 18px;border-top:1px solid var(--line);align-items:flex-start}
.req .body{flex:1;min-width:0}
.req .body b{font-weight:500}
.req .body p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.req .acts{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- MODAL / POPOVER / TOAST ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:oklch(0.2 0.03 200 / .42);display:grid;place-items:center;padding:16px;animation:fade .2s var(--ease)}
.modal{width:100%;max-width:480px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);animation:pop .28s var(--ease)}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 6px}
.modal-h h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:0}
:lang(zh) .modal-h h2{font-weight:600;font-size:22px}
.modal-h p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}
.modal-h .x{margin-left:auto}
.modal-b{padding:14px 22px 6px;display:grid;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px 20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err-sum{background:var(--err-soft);color:var(--err);border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.pop{position:fixed;z-index:80;width:380px;max-width:calc(100vw - 24px);max-height:70dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .22s var(--ease)}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.pop-h h2{font-size:15px;font-weight:600;margin:0}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;animation:pop .25s var(--ease)}
.toast svg{color:oklch(0.82 0.12 152)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .2s}

/* ---------- STAFF PHONE ---------- */
.phone-stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center;max-width:1100px;margin:0 auto;padding:40px 28px;min-height:calc(100dvh - 44px)}
.phone-intro .eyebrow{color:var(--accent-strong);font-weight:500}
.phone-intro h1{font-family:var(--f-display);font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 14px;max-width:12ch}
:lang(zh) .phone-intro h1{font-weight:600;font-size:36px;line-height:1.3;max-width:none}
.phone-intro p{color:var(--ink-2);max-width:42ch;margin:0 0 20px}
.phone-intro ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.phone-intro li{display:flex;gap:10px;color:var(--ink-2)}
.phone-intro li svg{color:var(--brand);margin-top:3px}
.phone{width:390px;height:min(820px,calc(100dvh - 120px));min-height:640px;border-radius:44px;background:var(--ground);border:10px solid var(--ink);box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 4px;font-size:13px;font-weight:600}
.ph-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
.ph-head .logo{font-size:16px}.ph-head .logo-mark{width:26px;height:26px}
.ph-view{flex:1;overflow-y:auto;padding:4px 16px 20px;font-size:16px}
.ph-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 14px}
.ph-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;text-decoration:none;color:var(--ink-3);border-radius:10px;min-height:48px}
.ph-nav a[aria-current=page]{color:var(--brand)}
.ph-nav a[aria-current=page] svg{stroke-width:2.2}
.hello{margin:6px 0 14px}
.hello small{color:var(--ink-3);font-size:14px}
.hello h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:2px 0 0}
:lang(zh) .hello h1{font-weight:600;font-size:26px}
.clock-card{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.clock-card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,oklch(0.45 0.06 190),transparent 70%)}
.clock-card > *{position:relative}
.clock-card .now{font-family:var(--f-display);font-size:54px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock-card .meta{font-size:14px;color:var(--brand-ink-2);margin-top:6px}
.clock-card .wifi{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:oklch(1 0 0 / .1);border-radius:99px;padding:4px 10px;margin-top:14px}
.clock-card .wifi svg{width:14px;height:14px;color:oklch(0.85 0.12 152)}
.punch-btn{width:100%;min-height:56px;margin-top:18px;border:0;border-radius:16px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:oklch(0.2 0.03 45);transition:transform .15s var(--ease)}
.punch-btn:active{transform:scale(.97)}
.punch-btn.out{background:var(--brand-ink);color:var(--brand)}
.m-sec{margin-top:20px}
.m-sec h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.m-sec h2 small{font-weight:400;color:var(--ink-3);font-size:13px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.m-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:15px}
.m-item:first-child{border-top:0}
.m-item .d{width:44px;text-align:center;flex:none}
.m-item .d b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;font-weight:400}
.m-item .d small{display:block;font-size:11.5px;color:var(--ink-3);text-transform:uppercase}
.m-item .body{flex:1;min-width:0}
.m-item .body b{display:block;font-weight:500;font-size:15px}
.m-item .body small{display:block;font-size:13px;color:var(--ink-3)}
.m-item.today{background:var(--brand-soft)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.m-pad{padding:14px}

/* ---------- KIOSK ---------- */
.kiosk{position:fixed;inset:0;z-index:100;background:radial-gradient(90% 70% at 0% 0%,oklch(0.40 0.06 192),transparent 60%),var(--brand-3);color:var(--brand-ink);display:grid;grid-template-columns:1fr 1fr;animation:fade .25s var(--ease)}
.k-left{padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid oklch(1 0 0 / .08)}
.k-time{font-family:var(--f-display);font-size:clamp(84px,10vw,150px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.k-date{font-size:20px;color:var(--brand-ink-2);margin-top:12px}
.k-store{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--brand-ink-2)}
.k-right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative}
.k-exit{position:absolute;top:24px;right:24px}
.k-exit,.k-hint-btn{border:1px solid oklch(1 0 0 / .16);background:transparent;color:var(--brand-ink);min-height:40px;border-radius:10px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.k-prompt{font-size:20px;margin-bottom:22px;color:var(--brand-ink)}
.k-dots{display:flex;gap:16px;margin-bottom:28px;height:18px}
.k-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand-ink-2);transition:background .15s,border-color .15s,transform .15s}
.k-dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.05)}
.k-dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.k-pad{display:grid;grid-template-columns:repeat(3,84px);gap:14px}
.k-pad button{height:84px;border-radius:50%;border:1px solid oklch(1 0 0 / .14);background:oklch(1 0 0 / .05);color:var(--brand-ink);font-size:30px;font-family:var(--f-display);display:grid;place-items:center;transition:background .15s,transform .12s}
.k-pad button:active{transform:scale(.94);background:oklch(1 0 0 / .14)}
@media(hover:hover){.k-pad button:hover{background:oklch(1 0 0 / .1)}}
.k-pad .ghost{border-color:transparent;background:transparent}
.k-err{color:oklch(0.82 0.09 40);font-size:15px;min-height:24px;margin-top:18px}
.k-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center}
.k-hint-list{margin-top:10px;background:oklch(1 0 0 / .07);border-radius:12px;padding:10px 14px;display:grid;gap:4px;font-size:14px;text-align:left;min-width:260px}
.k-hint-list div{display:flex;justify-content:space-between;gap:18px}
.k-hint-list b{font-variant-numeric:tabular-nums;letter-spacing:.12em}
.k-card{width:min(420px,100%);background:oklch(1 0 0 / .06);border:1px solid oklch(1 0 0 / .1);border-radius:24px;padding:28px;text-align:center;animation:pop .25s var(--ease)}
.k-card .av{width:64px;height:64px;font-size:20px;margin:0 auto 12px;background:var(--accent);color:#fff}
.k-card h2{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1.1}
:lang(zh) .k-card h2{font-weight:600;font-size:28px}
.k-card p{color:var(--brand-ink-2);margin:6px 0 0}
.k-card .shift{display:inline-flex;gap:8px;align-items:center;margin-top:16px;background:oklch(1 0 0 / .08);border-radius:99px;padding:6px 14px;font-size:14px}
.k-acts{display:grid;gap:10px;margin-top:22px}
.k-acts .punch-btn{margin:0}
.k-acts .cancel{background:transparent;border:0;color:var(--brand-ink-2);min-height:44px;font-size:15px}
.k-ok{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:oklch(0.85 0.12 152 / .18);color:oklch(0.85 0.12 152)}
.k-ok svg{width:36px;height:36px}

/* ---------- MODULES ---------- */
.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--info-soft);color:var(--info);font-size:14px;margin-bottom:14px}
/* schedule */
table.sched{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:900px}
.sched thead th{font-weight:500;color:var(--ink-3);font-size:12.5px;padding:12px 6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.sched thead th small{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);line-height:1.1;font-weight:400}
.sched thead th.today,.sched thead th.today small{color:var(--accent-strong)}
.sched thead th:first-child{padding-left:18px}
.sched td,.sched tbody th{padding:5px;border-bottom:1px solid var(--line);vertical-align:middle}
.sched tbody th{font-weight:400;text-align:left;padding-left:18px;min-width:180px}
.sched td.r,.sched th.r{text-align:right;padding-right:18px}
.shift-cell{width:100%;min-height:48px;border-radius:9px;border:1px solid transparent;text-align:left;padding:5px 8px;display:grid;line-height:1.25;font-size:12.5px;transition:transform .15s var(--ease),box-shadow .2s;font-variant-numeric:tabular-nums}
.shift-cell b{font-weight:600}.shift-cell span{opacity:.75}
.shift-cell:active{transform:scale(.97)}
@media(hover:hover){.shift-cell:not(.past):hover{box-shadow:0 0 0 2px var(--brand-2) inset}}
.shift-cell.t0{background:var(--brand-soft);color:var(--brand)}
.shift-cell.t1{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
.shift-cell.t2{background:var(--brand);color:var(--brand-ink)}
.shift-cell.tc{background:var(--surface);color:var(--ink);border:1.5px dashed var(--brand-2)}
.shift-cell.past{opacity:.55;cursor:default}
.shift-add{width:100%;min-height:48px;border:1.5px dashed var(--line-2);border-radius:9px;background:transparent;color:var(--ink-3);font-size:18px;opacity:0;transition:opacity .2s}
.sched tr:hover .shift-add,.shift-add:focus-visible{opacity:1}
@media(hover:none){.shift-add{opacity:.55}}
.sched tfoot td{font-size:12.5px;color:var(--ink-2);padding:10px 6px;background:var(--surface-2);border-top:1px solid var(--line-2)}
.sched tfoot td:first-child{padding-left:18px;font-weight:600;color:var(--ink)}
.ot{color:var(--warn)}
i.lg{width:18px;height:10px;border-radius:3px;display:inline-block}
i.lg.t0{background:var(--brand-soft);border:1px solid var(--brand-2)} i.lg.t1{background:var(--surface-2);border:1px solid var(--line-2)} i.lg.t2{background:var(--brand)}
/* checklists & tasks */
.g-2col{display:grid;grid-template-columns:1fr 1fr;gap:0}
.g-2col .cl+.cl{border-left:1px solid var(--line)}
.cl{padding:4px 18px 16px}
.cl-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cl-h b{font-weight:600;font-size:14px}
.cl-list{list-style:none;margin:6px 0 0;padding:0}
.cl-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.cl-list li small{margin-left:auto;color:var(--ink-3);font-size:12.5px;white-space:nowrap}

/* documents */
.doc-ico{width:32px;height:40px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:end center;padding-bottom:5px;color:var(--err);flex:none;font-size:8.5px;font-weight:700;letter-spacing:.04em;position:relative}
.doc-ico::before{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;background:linear-gradient(225deg,var(--ground) 50%,var(--line-2) 50%);border-radius:0 5px 0 3px}
.paper{background:#fff;color:#222;border:1px solid var(--line);border-radius:10px;padding:26px 28px;box-shadow:0 10px 30px oklch(0.3 0.03 195 / .08)}
.paper-h{display:flex;justify-content:space-between;font-size:11px;color:#888;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:16px;gap:12px}

.paper h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 10px}

/* training */
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}

.modal.lg{max-width:680px}

/* items */

/* tour */
.tour{position:fixed;right:20px;bottom:20px;z-index:70;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);animation:pop .35s var(--ease)}

.tour .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11.5px;flex:none;font-weight:600;color:var(--ink-2)}
.tour .n svg{width:12px;height:12px;stroke-width:3}
.tour li.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}

.tour.mob,.tour-pill.mob{display:none}
.tour-pill{position:fixed;right:20px;bottom:20px;z-index:70;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:500;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .3s var(--ease)}

@media (max-width:1180px){.courses{grid-template-columns:minmax(0,1fr)}}
@media (max-width:767px){
 .tour{left:12px;right:12px;width:auto;bottom:12px}

 .g-2col{grid-template-columns:minmax(0,1fr)}.g-2col .cl+.cl{border-left:0;border-top:1px solid var(--line);padding-top:14px}

}

/* staff full layout */

.flow-step b{display:block;font-weight:500;font-size:14px;line-height:1.3}.flow-step small{display:block;color:var(--ink-3);font-size:12.5px}

.cell-flag{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent-strong)}

.shift-cell{position:relative}
.shift-cell.open{background:var(--warn-soft);color:var(--warn);border:1.5px dashed var(--warn)}
.sched tfoot .short,.short{color:var(--err)}
i.lg.tc{background:var(--surface);border:1.5px dashed var(--brand-2)}
.pick{display:grid;gap:8px}
.pick-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;transition:border-color .2s,background .2s}
@media(hover:hover){.pick-row:hover{border-color:var(--brand-2);background:var(--surface-2)}}
.days{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days legend{font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px;padding:0}

.day span b{font-family:var(--f-display);font-size:20px;font-weight:400;color:var(--ink)}
.day input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

.day input:focus-visible+span{outline:2px solid var(--accent-strong);outline-offset:2px}

.modes{border:0;padding:0;margin:0}.modes legend{font-size:13px;font-weight:500;color:var(--ink-2);padding:0}
.steps-mini{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ack-card{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r);border:1px solid oklch(from var(--warn) 0.85 0.06 h);background:var(--warn-soft);margin-bottom:16px;flex-wrap:wrap}

.kiosk-entry > svg:last-child{margin-left:auto;color:var(--ink-3)}

.req .acts{align-self:center}
@media (max-width:767px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}.flow{flex-direction:column;align-items:flex-start}.flow-line{width:1.5px;height:14px;min-width:0;flex:none;margin-left:13px}}
/* ---------- RESPONSIVE ---------- */
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21,.g-11{grid-template-columns:minmax(0,1fr)}}

 const Wd=640,H=230,pl=34,pb=28,pt=10,bw=46,gap=(Wd-pl-bw*7)/7;const y=v=>pt+(H-pt-pb)*(1-v/max);
 let g='';for(let v=0;v<=max;v+=max/4){g+=`<line x1="${pl}" x2="${Wd}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${Math.round(v)}</text>`}
 const bars=data.map((d,i)=>{const x=pl+gap/2+i*(bw+gap);let acc=0;let r='';

  const tot=d.per.reduce((a,b)=>a+b,0);
  r+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="11.5" fill="${d.k===tk?'var(--ink)':'var(--ink-3)'}" font-weight="${d.k===tk?600:400}">${fromKey(d.k).toLocaleDateString(locale(),{weekday:'short'})}</text>`;

 return`<div class="chart"><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${T('Clocked hours by day this week, stacked by store','本周每天打卡工时，按门店堆叠')}">${g}${bars}</svg></div>

function timesheetRows(keys,sc){
 const tk=todayKey(),db=DB();
 return db.emps.filter(e=>inScope(e,sc)).map(e=>{let mins=0,days=0,edits=0,inc=0;keys.forEach(k=>{if(k>tk)return;const sh=db.shifts[e.id+'_'+k];if(!sh)return;const s=status(sh);if(s.k==='missed'){inc++;return}const w=worked(sh);if(w){mins+=w;days++}if(db.punches[sh.id]&&db.punches[sh.id].edited)edits++});
  const reg=Math.min(mins,2400),ot=Math.max(0,mins-2400);return{e,mins,reg,ot,days,edits,inc}}).sort((a,b)=>a.e.store.localeCompare(b.e.store)||a.e.idx-b.e.idx);
}

MPAGES.myschedule=()=>{const e=staffE(),db=DB(),tk=todayKey(),nm=nowMin();markDone('mysched');

 const item=(x)=>{const future=x.date>tk||(x.date===tk&&x.start>nm),pr=db.reqs.find(r=>r.shift===x.id&&(r.status==='pending'||r.status==='pending_peer'));const d=fromKey(x.date);

 <div class="banner">${ic('info','s')}<span>${T('Need a different shift? Use Swap to hand it to a coworker, or Change to move it, change the hours or take the day off. Your manager approves either one.','需要调整？“换班”把班次交给同事；“调班”可以改时间、换一天或请假。两种都由店长审批。')}</span></div>

  return`<div class="m-sec" style="margin-top:0"><h2>${w.lbl} <small>${list.length} ${T('shifts','个班')} · ${hrs(list.reduce((a,x)=>a+BRK(x.end-x.start),0),1)} h</small></h2><div class="m-card">${list.map(item).join('')||`<div class="m-pad muted">${T('No shifts','没有班次')}</div>`}</div></div>`}).join('')}
 <div class="m-sec" style="margin-top:0"><h2>${T('My requests','我的申请')}</h2><div class="m-card">${reqs.length?reqs.map(r=>`<div class="m-item"><div class="body"><b>${L(REQT[r.type])}</b><small>${esc(reqSummary(r))}</small>${r.decisionNote?`<small style="color:var(--err)">${T('Reason','原因')}: ${esc(r.decisionNote)}</small>`:''}</div>${myReqChip(r)}</div>`).join(''):`<div class="m-pad muted">${T('No requests yet','暂无申请')}</div>`}</div></div></div>`};

function reqFix(sid){const db=DB(),sh=db.shifts[sid],p=db.punches[sid]||{};const field=p.in==null?'in':'out';
 modal(`<div class="modal-h"><div><h2>${T('Fix a punch','申请补卡')}</h2><p>${fmtDay(sh.date)} · ${T('Scheduled','排班')} ${fmtT(sh.start)} – ${fmtT(sh.end)}</p></div><button class="btn btn-icon btn-quiet x" data-act="closeModal" aria-label="${T('Close','关闭')}">${ic('x')}</button></div>
 <form data-form="fixreq" data-v="${sid}" novalidate><div class="modal-b"><div class="row2"><div class="field"><label for="xf">${T('Which punch','哪一个卡')}</label><select class="input" id="xf"><option value="in" ${field==='in'?'selected':''}>${T('Clock in','上班卡')}</option><option value="out" ${field==='out'?'selected':''}>${T('Clock out','下班卡')}</option></select></div><div class="field"><label for="xt">${T('Correct time','正确时间')}</label><input class="input" type="time" id="xt" value="${toHM(field==='in'?sh.start:(p.out!=null?p.out:sh.end))}"></div></div>

function needNote(f,id,msg){const v=f.querySelector('#'+id).value.trim();if(!v){f.querySelector('#'+id+'Err').innerHTML=`<span class="err-msg">${ic('alert','s')}${msg}</span>`;f.querySelector('#'+id).setAttribute('aria-invalid','true');f.querySelector('#'+id).focus();return null}return v}
function saveFixReq(f){const n=needNote(f,'xn',T('Add a short note for your manager.','请给店长写一句说明。'));if(!n)return;const db=DB(),sh=db.shifts[f.dataset.v];
 db.reqs.push({id:'r'+(db.seq++)+'_'+Date.now(),type:'fix',store:empOf(sh).store,emp:sh.emp,shift:sh.id,field:f.querySelector('#xf').value,value:fromHM(f.querySelector('#xt').value),note:n,status:'pending',at:now().getTime(),snap:(()=>{const x=DB().shifts[sh&&sh.id];return x?{date:x.date,start:x.start,end:x.end}:null})()});
 save();closeModal();renderView();toast(T('Sent to your manager','已发给店长'))}
function reqSwap(sid){const db=DB(),sh=db.shifts[sid],e=empOf(sh),peers=staffOf(e.store).filter(x=>x.idx>0&&x.id!==e.id&&!db.shifts[x.id+'_'+sh.date]);
 modal(`<div class="modal-h"><div><h2>${T('Swap this shift','换班')}</h2><p>${fmtDay(sh.date,{weekday:'long',month:'short',day:'numeric'})} · ${fmtT(sh.start)} – ${fmtT(sh.end)}</p></div><button class="btn btn-icon btn-quiet x" data-act="closeModal" aria-label="${T('Close','关闭')}">${ic('x')}</button></div>
 <form data-form="swapreq" data-v="${sid}" novalidate><div class="modal-b"><div class="field"><label for="wp">${T('Who will cover it?','谁来接班？')}</label>${peers.length?`<select class="input" id="wp">${peers.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(posName(x))}</option>`).join('')}</select><span class="help">${T('Only coworkers who are free that day are listed.','只列出当天没有排班的同事。')}</span>`:`<p class="muted" style="margin:0">${T('Nobody is free that day — try Change instead.','当天没有空闲的同事，可以改用“调班”。')}</p>`}</div>
 <div class="field"><label for="wn">${T('Note','说明')} <span style="color:var(--err)">*</span></label><textarea class="input" id="wn" aria-describedby="wnErr" placeholder="${T('e.g. Family event that evening','例如：那天晚上有家庭聚会')}"></textarea><div id="wnErr"></div></div>
 <div class="steps-mini"><span>1. ${T('Coworker accepts','同事同意')}</span>${ic('arrow','s')}<span>2. ${T('Manager approves','店长批准')}</span>${ic('arrow','s')}<span>3. ${T('Schedule updates','排班自动更新')}</span></div></div>
 <div class="modal-f"><button type="button" class="btn" data-act="closeModal">${T('Cancel','取消')}</button>${peers.length?`<button type="submit" class="btn btn-primary">${ic('send','s')}${T('Send request','提交申请')}</button>`:''}</div></form>`)}
function saveSwapReq(f){const n=needNote(f,'wn',T('Add a short note.','请写一句说明。'));if(!n)return;const db=DB(),sh=db.shifts[f.dataset.v],peer=f.querySelector('#wp').value,id='r'+(db.seq++)+'_'+Date.now(),ind=S.ind;
 db.reqs.push({id,type:'swap',store:empOf(sh).store,emp:sh.emp,shift:sh.id,peer,peerOk:false,note:n,status:'pending_peer',at:now().getTime(),snap:{date:sh.date,start:sh.start,end:sh.end}});save();markDone('swap');closeModal();renderView();toast(T(`Sent to ${emp(peer).name}. To accept, switch the staff view to ${emp(peer).name.split(' ')[0]} in the demo bar.`,`已发给 ${emp(peer).name}。可在顶部演示栏切换到 ${emp(peer).name} 来同意。`));
 note(peer,'cal',[`${emp(sh.emp).name} asked you to cover a shift`,`${emp(sh.emp).name} 请你代班`],[`${fmtDayEN(sh.date)} · ${fmtTEN(sh.start)}–${fmtTEN(sh.end)}`,`${sh.date.slice(5)} · ${toHM(sh.start)}–${toHM(sh.end)}`],'#/myschedule');save();}
function reqAdjust(sid){const db=DB(),sh=db.shifts[sid],e=empOf(sh),wk=weekKeysOff(Math.round(dayDiff(weekOf(sh.date))/7)),tk=todayKey(),free=wk.filter(k=>k>tk&&k!==sh.date&&!db.shifts[e.id+'_'+k]);
 modal(`<div class="modal-h"><div><h2>${T('Change this shift','调班')}</h2><p>${fmtDay(sh.date,{weekday:'long',month:'short',day:'numeric'})} · ${fmtT(sh.start)} – ${fmtT(sh.end)}</p></div><button class="btn btn-icon btn-quiet x" data-act="closeModal" aria-label="${T('Close','关闭')}">${ic('x')}</button></div>
 <form data-form="adjreq" data-v="${sid}" novalidate><div class="modal-b"><fieldset class="modes"><legend>${T('What do you need?','你需要什么？')}</legend>
 <label class="opt"><input type="radio" name="am" value="time" checked data-chg="adjmode"> ${T('Different hours that day','当天改时间')}</label><label class="opt"><input type="radio" name="am" value="day" data-chg="adjmode" ${free.length?'':'disabled'}> ${T('Move to another day this week','挪到本周另一天')}${free.length?'':' · '+T('no free days','没有空闲日')}</label><label class="opt"><input type="radio" name="am" value="off" data-chg="adjmode"> ${T('Take the day off','这天请假不上')}</label></fieldset>

 <div class="am am-day" hidden><div class="field"><label for="ad">${T('Move to','挪到')}</label><select class="input" id="ad">${free.map(k=>`<option value="${k}">${fmtDay(k,{weekday:'long',month:'short',day:'numeric'})}</option>`).join('')}</select></div></div>

 <div class="field"><label for="an">${T('Reason','原因')} <span style="color:var(--err)">*</span></label><textarea class="input" id="an" aria-describedby="anErr"></textarea><div id="anErr"></div></div></div>
 <div class="modal-f"><button type="button" class="btn" data-act="closeModal">${T('Cancel','取消')}</button><button type="submit" class="btn btn-primary">${ic('send','s')}${T('Send to manager','发给店长')}</button></div></form>`)}

 if(mode==='time'){const t=readTimes(f);if(!t)return;r.start=t[0];r.end=t[1]}if(mode==='day')r.date=f.querySelector('#ad').value;

function decide(r,status,extra){Object.assign(r,{status,decidedBy:me().name,decidedAt:now().getTime()},extra||{})}
function approveReq(id){const db=DB(),r=db.reqs.find(x=>x.id===id),sh=db.shifts[r.shift];if(sh)r.snap={date:sh.date,start:sh.start,end:sh.end};if(!sh){decide(r,'declined',{decisionNote:'Shift no longer exists'});save();renderView();return}
 const fail=m=>{toast(m);return};
 if(r.type==='fix'){if(isLocked(sh.date))return fail(T('That week is locked by accounting.','该周已被会计锁定。'));const p=db.punches[sh.id]||(db.punches[sh.id]={in:null,out:null,src:'manager'});
  db.audit.push({id:'a'+(db.seq++)+'_'+Date.now(),shift:sh.id,by:me().name,at:now().getTime(),field:r.field,from:p[r.field],to:r.value,reason:r.field==='in'?'forgot_in':'forgot_out',note:r.note,ack:'ok'});p[r.field]=r.value;p.edited=true;reopenWeek(empOf(sh).store,sh.date);
  note(r.emp,'ok',['Your punch fix was approved','你的补卡申请已批准'],[`${fmtDayEN(sh.date)} · ${r.field==='in'?'in':'out'} ${fmtTEN(r.value)}`,`${sh.date.slice(5)} · ${r.field==='in'?'上班':'下班'} ${toHM(r.value)}`],'#/punches')}
 if(r.type==='swap'){if(db.shifts[r.peer+'_'+sh.date])return fail(T(`${emp(r.peer).name} is already scheduled that day.`,`${emp(r.peer).name} 当天已有班次。`));
  delete db.shifts[sh.id];db.shifts[r.peer+'_'+sh.date]={id:r.peer+'_'+sh.date,emp:r.peer,date:sh.date,start:sh.start,end:sh.end};
  note(r.emp,'ok',['Swap approved — shift removed from your schedule','换班已批准，该班次已从你的排班移除'],[`${fmtDayEN(sh.date)} → ${emp(r.peer).name}`,`${sh.date.slice(5)} → ${emp(r.peer).name}`],'#/myschedule');
  note(r.peer,'cal',['You picked up a shift','你接了一个班'],[`${fmtDayEN(sh.date)} · ${fmtTEN(sh.start)}–${fmtTEN(sh.end)}`,`${sh.date.slice(5)} · ${toHM(sh.start)}–${toHM(sh.end)}`],'#/myschedule')}
 if(r.type==='adjust'){
  if(r.mode==='time'){sh.start=r.start;sh.end=r.end}
  else if(r.mode==='day'){if(db.shifts[sh.emp+'_'+r.date])return fail(T('Already scheduled on that day.','那一天已有班次。'));delete db.shifts[sh.id];db.shifts[sh.emp+'_'+r.date]={id:sh.emp+'_'+r.date,emp:sh.emp,date:r.date,start:sh.start,end:sh.end}}

function runCourse(v){const[cid,mode]=v.split('|');S.run={cid,step:0,preview:mode==='preview',ans:{},res:null};drawRun(true)}

 const dots=`<div class="run-dots">${[...Array(steps)].map((_,i)=>`<i class="${i<=R.step?'on':''}"></i>`).join('')}</div>`;

function tick(){const n=now(),nm=nowMin();
 document.querySelectorAll('[data-clock="short"]').forEach(el=>el.textContent=fmtT(nm));

 document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=elapsed(Number(el.dataset.elapsed)));}
var lastMin=nowMin();
setInterval(()=>{tick();const m=nowMin();if(m!==lastMin){lastMin=m;save();if(S.role&&!S.modal&&!S.pop&&!S.kiosk){const r=route().p;if(['dashboard','home'].includes(r))renderView()}}},1000);

load();render();
})();
